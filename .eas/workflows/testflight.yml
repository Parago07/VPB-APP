name: TestFlight

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build do iPhone
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Envio ao TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
